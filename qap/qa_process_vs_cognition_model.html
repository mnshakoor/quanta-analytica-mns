<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAP vs Five-Layer Cognition Model</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
    margin: 0;
  }
  svg text { font-family: system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1a18; }
  .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }

  /* c-gray */
  .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5f5e5a; }

  /* c-purple */
  .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
  .c-purple .th { fill: #3c3489; }
  .c-purple .ts { fill: #534ab7; }

  /* c-amber */
  .c-amber rect { fill: #faeeda; stroke: #854f0b; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854f0b; }

  /* c-blue */
  .c-blue rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue .th { fill: #0c447c; }
  .c-blue .ts { fill: #185fa5; }

  /* c-teal */
  .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0f6e56; }

  .node { cursor: pointer; }
  .node:hover rect { opacity: 0.85; }
  .arr { stroke: #888780; fill: none; stroke-width: 1.5; }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1a; }
    .th { fill: #e8e6dc; }
    .ts { fill: #b4b2a9; }
    .c-gray rect { fill: #2c2c2a; stroke: #888780; }
    .c-gray .th { fill: #d3d1c7; }
    .c-gray .ts { fill: #888780; }
    .c-purple rect { fill: #26215c; stroke: #7f77dd; }
    .c-purple .th { fill: #cecbf6; }
    .c-purple .ts { fill: #afa9ec; }
    .c-amber rect { fill: #412402; stroke: #ba7517; }
    .c-amber .th { fill: #fac775; }
    .c-amber .ts { fill: #ef9f27; }
    .c-blue rect { fill: #042c53; stroke: #378add; }
    .c-blue .th { fill: #b5d4f4; }
    .c-blue .ts { fill: #85b7eb; }
    .c-teal rect { fill: #04342c; stroke: #1d9e75; }
    .c-teal .th { fill: #9fe1cb; }
    .c-teal .ts { fill: #5dcaa5; }
    .arr { stroke: #888780; }
  }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- QAP Pipeline (left column) -->
<text class="th" x="165" y="28" text-anchor="middle">Quanta Analytica Process™</text>
<text class="ts" x="165" y="44" text-anchor="middle">Operational workflow</text>

<g class="node c-gray">
  <rect x="30" y="58" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="80" text-anchor="middle" dominant-baseline="central">1 · Problem framing</text>
</g>
<line x1="165" y1="102" x2="165" y2="118" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
  <rect x="30" y="118" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="140" text-anchor="middle" dominant-baseline="central">2 · Data acquisition</text>
</g>
<line x1="165" y1="162" x2="165" y2="178" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 3: highlighted -->
<g class="node c-purple">
  <rect x="30" y="178" width="270" height="56" rx="8" stroke-width="1"/>
  <text class="th" x="165" y="198" text-anchor="middle" dominant-baseline="central">3 · Structured analysis</text>
  <text class="ts" x="165" y="218" text-anchor="middle" dominant-baseline="central">← Five-Layer Model operates here</text>
</g>
<line x1="165" y1="234" x2="165" y2="250" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
  <rect x="30" y="250" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="272" text-anchor="middle" dominant-baseline="central">4 · Scenario modeling</text>
</g>
<line x1="165" y1="294" x2="165" y2="310" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
  <rect x="30" y="310" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="332" text-anchor="middle" dominant-baseline="central">5 · Strategic judgement</text>
</g>
<line x1="165" y1="354" x2="165" y2="370" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
  <rect x="30" y="370" width="270" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="390" text-anchor="middle" dominant-baseline="central">Analytical products</text>
  <text class="ts" x="165" y="410" text-anchor="middle" dominant-baseline="central">SitReps, risk assessments, briefs</text>
</g>

<!-- Divider -->
<line x1="340" y1="30" x2="340" y2="460" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- Five-Layer Model (right column) -->
<text class="th" x="515" y="28" text-anchor="middle">Five-Layer Cognition Model</text>
<text class="ts" x="515" y="44" text-anchor="middle">Analytical reasoning engine</text>

<g class="node c-gray">
  <rect x="380" y="178" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="515" y="193" text-anchor="middle" dominant-baseline="central">Foundations</text>
  <text class="ts" x="515" y="211" text-anchor="middle" dominant-baseline="central">System baseline mapping</text>
</g>
<line x1="515" y1="222" x2="515" y2="238" class="arr" marker-end="url(#arrow)"/>

<g class="node c-amber">
  <rect x="380" y="238" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="515" y="253" text-anchor="middle" dominant-baseline="central">Mechanisms</text>
  <text class="ts" x="515" y="271" text-anchor="middle" dominant-baseline="central">Causal driver analysis</text>
</g>
<line x1="515" y1="282" x2="515" y2="298" class="arr" marker-end="url(#arrow)"/>

<g class="node c-blue">
  <rect x="380" y="298" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="515" y="313" text-anchor="middle" dominant-baseline="central">Dynamics</text>
  <text class="ts" x="515" y="331" text-anchor="middle" dominant-baseline="central">System behavior modeling</text>
</g>
<line x1="515" y1="342" x2="515" y2="358" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal">
  <rect x="380" y="358" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="515" y="373" text-anchor="middle" dominant-baseline="central">Leverage</text>
  <text class="ts" x="515" y="391" text-anchor="middle" dominant-baseline="central">Strategic intervention analysis</text>
</g>
<line x1="515" y1="402" x2="515" y2="418" class="arr" marker-end="url(#arrow)"/>

<g class="node c-purple">
  <rect x="380" y="418" width="270" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="515" y="433" text-anchor="middle" dominant-baseline="central">Paradigms</text>
  <text class="ts" x="515" y="451" text-anchor="middle" dominant-baseline="central">Strategic framing and worldview</text>
</g>

<!-- Bracket connecting stage 3 to the five layers -->
<path d="M300 206 L340 206 L340 440 L380 440" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M300 178 L320 178 L320 462 L380 462" fill="none" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Bottom analogy -->
<text class="ts" x="165" y="468" text-anchor="middle">The aircraft (flight path)</text>
<text class="ts" x="515" y="468" text-anchor="middle">The navigation system (how to think)</text>
</svg>
</body>
</html>
